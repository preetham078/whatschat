<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhatsChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <button class="icon-button mobile-only" id="profileToggle" aria-label="Profile">☰</button>
        <div>
          <h1>WhatsChat</h1>
          <span id="topSubtitle">Username messages</span>
        </div>
        <button class="icon-button mobile-only" id="composeButton" aria-label="New chat">＋</button>
      </header>

      <aside class="sidebar" id="sidebar">
        <section class="brand desktop-only">
          <div class="brand-mark">W</div>
          <div>
            <h2>WhatsChat</h2>
            <p>Ping people by username.</p>
          </div>
        </section>

        <section class="auth-panel" id="authPanel">
          <div class="auth-tabs">
            <button class="auth-tab active" data-auth="login">Login</button>
            <button class="auth-tab" data-auth="signup">Sign up</button>
          </div>

          <form id="loginForm" class="auth-form">
            <label>Username<input name="username" autocomplete="username" placeholder="preetham078" required></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Login</button>
          </form>

          <form id="signupForm" class="auth-form hidden">
            <label>Name<input name="displayName" autocomplete="name" placeholder="Preetham" required></label>
            <label>Username<input name="username" autocomplete="username" placeholder="preetham078" required></label>
            <label>Password<input name="password" type="password" autocomplete="new-password" minlength="4" required></label>
            <label>Bio<textarea name="bio" maxlength="180" placeholder="Available for chats"></textarea></label>
            <button type="submit">Create account</button>
          </form>
        </section>

        <section class="profile-panel hidden" id="profilePanel">
          <div class="profile-card">
            <div class="avatar" id="profileAvatar">W</div>
            <h2 id="profileName">WhatsChat</h2>
            <p id="profileUsername">@username</p>
            <p id="profileBio"></p>
            <div class="stats">
              <span><strong id="statFriends">0</strong> friends</span>
              <span><strong id="statChats">0</strong> chats</span>
              <span><strong id="statMessages">0</strong> messages</span>
            </div>
          </div>

          <form id="profileForm" class="profile-form">
            <label>Name<input name="displayName" required></label>
            <label>Bio<textarea name="bio" maxlength="180"></textarea></label>
            <button type="submit">Save profile</button>
          </form>
          <div class="profile-actions">
            <button id="shareProfile" type="button">Share profile</button>
            <button id="logoutButton" type="button" class="secondary">Logout</button>
          </div>
        </section>
      </aside>

      <main class="main">
        <nav class="tabs" id="tabs">
          <button class="tab active" data-view="chats">Chats</button>
          <button class="tab" data-view="requests">Requests</button>
          <button class="tab" data-view="friends">Add Friends</button>
        </nav>

        <section class="view active" id="chatsView">
          <div class="inbox" id="inboxList"></div>
          <div class="empty-state" id="emptyInbox">No chats yet. Add friends to start messaging.</div>
        </section>

        <section class="view" id="requestsView">
          <h2>Incoming</h2>
          <div class="list" id="incomingRequests"></div>
          <h2>Outgoing</h2>
          <div class="list" id="outgoingRequests"></div>
        </section>

        <section class="view" id="friendsView">
          <form class="search-row" id="searchForm">
            <input id="searchInput" placeholder="Search username" autocomplete="off">
            <button type="submit">Search</button>
          </form>
          <div class="list" id="searchResults"></div>
        </section>
      </main>

      <section class="chat-panel" id="chatPanel">
        <div class="chat-header">
          <button class="icon-button mobile-only" id="backToInbox" aria-label="Back">‹</button>
          <div class="mini-avatar" id="chatAvatar">?</div>
          <div>
            <h2 id="chatName">Select a chat</h2>
            <span id="chatUsername">Messages appear here</span>
          </div>
        </div>
        <div class="messages" id="messagesList"></div>
        <form class="message-form" id="messageForm">
          <input id="messageInput" placeholder="Message" disabled autocomplete="off">
          <button type="submit" disabled id="sendButton">Send</button>
        </form>
      </section>

      <nav class="bottom-nav mobile-only">
        <button class="bottom-tab active" data-view="chats">Chats</button>
        <button class="bottom-tab" data-view="requests">Requests</button>
        <button class="bottom-tab" data-view="friends">Add</button>
      </nav>
    </div>

    <div class="status" id="status"></div>
    <script src="app.js"></script>
  </body>
</html>
